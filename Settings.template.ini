; AC4 Modular Patch 0.3 alpha - settings. The installer writes this file; your own changes belong in User.ini next to
; it (same sections and keys, it wins over this file and is never touched by the installer).
[Modules]
CPUFix={CPU}
FPSAndElevator={FPS}
; 1 = skip the start-up logo videos (files stay on disk); 0 = videos as in the game
SkipIntro=0

[CPU]
; Intel 12th-14th gen / Core Ultra: run the game on performance cores only (ignored on other CPUs)
PerformanceCoresOnly=1

[FPS]
; 0 = monitor refresh minus AutoMargin (144 Hz -> 141 FPS, keeps G-Sync/FreeSync active); F10 toggles this limit / 60 FPS
Limit={LIMIT}
AutoMargin=3
AllDisplayModes=1
; resolution menu: at most MaxModes entries, refresh rates from MinRefresh Hz
MaxModes=24
MinRefresh=60
; hide resolutions smaller than this (ignored if the screen has none that large)
MinWidth=1920
MinHeight=1080
PrecisionWait=1

[Physics]
; Havok (bodies, ragdolls, objects) steps per second; the game uses 30
HavokRate=30
; NPC cloth and sails follow the character by the real movement of each frame (the game assumed 30 FPS: at 141 FPS skirts and sails moved ~2x too fast)
ClothFollowFix=1
; experiment: cloth, sails and flags step once per 30 Hz physics tick: 0 = game, 1 = shown smoothly in between, 2 = latest step
Cloth30=0
; older per-frame cloth formulas (replaced by ClothSolver; kept off)
ClothDampFix=0
ClothSkinFix=0
ClothIterFix=0
; own frame-rate independent thread solver for cloth, sails and coats (XPBD): sails fill and move as at 30 FPS at any frame rate
ClothSolver=1
; damping of fine ripples between neighbouring cloth points, per second (20 default)
ClothRippleDamping=20
; flags and ropes on the same solver; their ripple damping is lighter (flags live by their waves)
FlagSolver=1
FlagRippleDamping=5
; cloth wind experiment: 0 = game, 1 = gusts at most 30/s, 2 = at most 60/s, 3 = off
ClothWindMode=0
; ragdolls and other driven bodies: velocity from the target motion since the last physics step (the game assumed 30 FPS: at high FPS bodies twitched and were launched)
RagdollFollowFix=1
; ragdolls of different NPCs collide and a lying ragdoll keeps its physics (the game froze it into animation ~1 s after it landed: bodies sank into each other)
CorpsePhysics=1
; at most this many ragdolls keep their physics; over it the one farthest from the fight is frozen as in the game (0 = no limit)
CorpseLimit=20
; a body given a NaN/infinite velocity by the game gets zero instead (no flights into the sky)
NanGuard=1
; ragdoll parts get continuous collision (fast hands/heads no longer pass through walls and fences)
CorpseCCD=1

[PhysX]
; PhysX smoke/particles are simulated at most this many times per second (0 = every frame, as the original game)
SimRate=60
; do not wait for a running smoke simulation in crowds
BusySkip=1
; experiment, off: write smoke particles to the GPU only when they changed (made campfire smoke shadows flicker)
SmokeReuse=0
; cook each PhysX collision mesh once and reuse it
MeshCache=1
; smoke particles packed for the GPU in one pass (same particles and look, less CPU per frame)
ParticlePackV1=1
; campfire smoke density in percent (100 = game)
FireDensity=100
; campfire particle pool shared by all fires (game 100000, max 250000)
FireParticles=100000
; campfire PhysX smoke distances in metres (game: 6 / 15 / 20): full strength up to, faded out at, started at
SmokeFullDistance=6
SmokeFadeDistance=15
SmokeStartDistance=20
; smoke effects stop only beyond this distance (game: 20 = same as start, so walking along 20 m created and removed them again and again)
SmokeStopDistance=25
; --- PhysX on Direct3D 11 (nvcuda.dll + AC4-PhysX-D3D). 1 = on (default), 0 = off.
; keep APEX from crashing: race in ApexScene::simulate (+768da) and freed injector array (+dcbe0)
D3DApexGuard=1
; do not resend unchanged collision poses to APEX (its 16 KB command queue overflowed and waited for the simulation step)
D3DPoseSkip=1
; draw smoke sprites from a video-memory copy instead of reading them over PCIe on every pass
D3DSpriteVram=1
; the frame does not wait for the APEX lock just to hand over camera matrices
D3DViewSkip=1
; D3D11 interop with the game device when APEX asks for it
D3DInterop=1
; 1 = old ordering waits between uploads and kernel chunks (measured worse; off)
D3DChunkOrderWait=0
; diagnostics, only with [Debug] Diagnostics=1: D3DSmokeHide (F2/End hides smoke), D3DProfiler, D3DApexLock, D3DCritPath, D3DQueueStats, D3DCudaTrace

[Graphics]
; quality preset "{PRESET}"
; character detail (as AC4Tweaker): lower = detailed models further, 0 = always the best model; -1 = game
CharacterLOD={CHARLOD}
; world LOD scale (buildings, trees, props): lower = more detail, 0 = max; -1 = game value
LODScale={LODSCALE}
; distances in metres, -1 = game: characters drawn up to, dynamic/static props drawn up to, and their shadows
CharacterCullDistance=-1
DynamicPropsDistance=-1
StaticPropsDistance=-1
DynamicPropShadowsDistance=-1
StaticPropShadowsDistance=-1
; streaming range (as AC4Tweaker): close = city around you, far = islands at sea; 32 m per step, -1 = game
CloseLoadingRange=-1
FarLoadingRange=-1

[Experiment]
; the frame waits at most this long (microseconds) for its GPU query; -1 = the game's unlimited wait
GpuSyncLimitUs=500

[Debug]
; writes timing and stutter samples to AC4Fix/runtime.log (for development); also enables the test hotkeys
Diagnostics={DIAG}
; if the game hangs in front (no new frame) for this many seconds, it is closed and the reason logged (0 = off)
HangKill=15
